name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-windows'
      - 'v1.7'
      - 'v1.8*'

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permissions for Gradle
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build EXE and MSI
        run: ./gradlew :composeApp:packageReleaseDistributionForCurrentOS

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-EXE
          path: composeApp/build/compose/binaries/main-release/exe/*.exe

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherST-Tunnel-Windows-MSI
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

      - name: Compute MSI SHA256 sidecar
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main-release/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "No MSI found to hash" }
          $hash = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLower()
          "$hash  $($msi.Name)" | Out-File -Encoding ascii "$($msi.FullName).sha256"
          Get-Content "$($msi.FullName).sha256"

      - name: Create Release (Optional - only on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            composeApp/build/compose/binaries/main-release/exe/*.exe
            composeApp/build/compose/binaries/main-release/msi/*.msi
            composeApp/build/compose/binaries/main-release/msi/*.msi.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
